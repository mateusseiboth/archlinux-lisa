# Single source of the lisa boot facts shared by every distro port.
# Values come from the pmOS images that boot on the stock HyperOS 2 ABL; see
# xiaomi-lisa-mainline/docs/abl-requirements.md for why each one is required.
# shellcheck shell=bash disable=SC2034

LISA_DTB_NAME="sm7325-xiaomi-lisa.dtb"
LISA_HEADER_VERSION=3
LISA_PAGESIZE=4096
LISA_BASE=0x00000000
LISA_KERNEL_OFFSET=0x00008000
LISA_RAMDISK_OFFSET=0x01000000
LISA_TAGS_OFFSET=0x00000100
LISA_DTB_OFFSET=0x01f00000

# cma=256M: the GPU and the camera ISP need it; tty0 keeps the boot console on the panel.
LISA_CMDLINE_BASE="console=tty0 cma=256M"

# The distro rootfs is a plain ext4 written straight to userdata.
LISA_ROOT_PARTLABEL="userdata"
LISA_ROOT_CMDLINE="root=PARTLABEL=${LISA_ROOT_PARTLABEL} rw rootwait"
